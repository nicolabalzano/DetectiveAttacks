worker_processes 1;

events { worker_connections 1024; }

http {
  sendfile on;

  server {
    listen 80;

    # Docker's internal DNS resolver — resolves upstream names at request time,
    # not at startup, so Nginx won't crash if a container hasn't started yet.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
      set $upstream_web web_interface:3001;
      proxy_pass http://$upstream_web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location /api/stix_and_vulnerability/ {
      set $upstream_stix stix_and_vulnerability:5002;
      proxy_pass http://$upstream_stix/;
      client_max_body_size 150M;
      proxy_read_timeout 300s;
      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/cvwelib/ {
      set $upstream_cvwelib cvwelib:5001;
      proxy_pass http://$upstream_cvwelib/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/capeclib/ {
      set $upstream_capeclib capeclib:5003;
      proxy_pass http://$upstream_capeclib/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/vuln_score_lite/ {
      set $upstream_vuln vuln_score_lite:5005;
      proxy_pass http://$upstream_vuln/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
